[package]
name = "parakey"
version = "0.2.0"
edition = "2024"
description = "Local push-to-talk dictation for Windows (Parakeet TDT, Ctrl+Win)"
license = "MIT"

[dependencies]
cpal = "0.18.2"
ort = { version = "2.0.0-rc.13", default-features = false, features = ["std", "download-binaries", "copy-dylibs", "directml", "tls-native", "api-22"] }
tiny-skia = "0.12.0"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_System_SystemInformation", "Win32_Security", "Win32_Graphics_Dwm"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
winresource = "0.1.31"
